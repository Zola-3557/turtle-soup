<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纠错与建议</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input[type="text"], textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #7f8c8d; text-decoration: none; }
        .back-link:hover { color: #2980b9; }
    </style>
</head>
<body>

    <h2>📝 纠错与建议</h2>
    <p style="text-align: center; color: #666; font-size: 14px;">如果您发现题目有误或有更好的汤底，欢迎提交建议！</p>

    <div class="form-group">
        <label for="soup-title">题目名称（选填）</label>
        <input type="text" id="soup-title" placeholder="例如：山崖抛尸">
    </div>

    <div class="form-group">
        <label for="feedback-text">具体建议 / 纠错内容</label>
        <textarea id="feedback-text" placeholder="请输入您的宝贵建议..."></textarea>
    </div>

    <button id="submit-btn">提交反馈</button>
    <a href="index.html" class="back-link">← 返回主页</a>

    <script>
        document.getElementById('submit-btn').addEventListener('click', async function() {
            const soupTitle = document.getElementById('soup-title').value;
            const feedback = document.getElementById('feedback-text').value;
            const btn = document.getElementById('submit-btn');

            if (!feedback.trim()) {
                alert("请输入具体的建议或纠错内容！");
                return;
            }

            btn.disabled = true;
            btn.innerText = "正在提交...";

            try {
                // 注意：此处请求的接口需要在 app.py 中实现后才能成功返回
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ soup_title: soupTitle, feedback: feedback })
                });
                const result = await response.json();
                
                if (response.ok) {
                    alert("提交成功！感谢您的反馈。");
                    document.getElementById('soup-title').value = '';
                    document.getElementById('feedback-text').value = '';
                } else {
                    alert("提交失败：" + result.msg);
                }
            } catch (error) {
                alert("接口暂未接入，请先检查后端是否已配置邮件接口。");
            } finally {
                btn.disabled = false;
                btn.innerText = "提交反馈";
            }
        });
    </script>
</body>
</html>
